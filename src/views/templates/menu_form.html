<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Menu - Meu Chatbot</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <header class="header">
        <div class="header-brand">
            <div class="logo">CB</div>
            <h1>Painel de Administração</h1>
        </div>

        <nav class="nav-links">
            <a href="/" class="nav-item">Início</a>
            <a href="/menus" class="nav-item">Lista Menus</a>
            <a href="/menus/novo" class="nav-item active">Formulário Menus</a>
            <a href="/usuarios" class="nav-item">Usuários</a>
            <a href="/historico" class="nav-item">Histórico</a>
            <a href="/login" class="nav-item">Login</a>
        </nav>
    </header>

    <main class="main-container">
        <section class="page-header">
            <h2 class="page-title">Cadastrar / Editar Menu</h2>
            <p class="page-subtitle">Configure o nó da árvore de menus, o texto do botão e a mensagem de resposta.</p>
        </section>

        <section class="form-card">
            <form action="/menus/salvar" method="POST">
                <div class="form-group">
                    <label for="nome">Nome Interno</label>
                    <input type="text" id="nome" name="nome" class="form-input" placeholder="Ex: menu_atendimento" required>
                </div>

                <div class="form-group">
                    <label for="nome_selecao">Texto de Seleção (Botão)</label>
                    <input type="text" id="nome_selecao" name="nome_selecao" class="form-input" placeholder="Ex: 1 - Falar com Atendente" required>
                </div>

                <div class="form-group">
                    <label for="mensagem">Mensagem de Resposta</label>
                    <textarea id="mensagem" name="mensagem" class="form-textarea" rows="4" placeholder="Mensagem exibida ao selecionar este item" required></textarea>
                </div>

                <div class="form-group">
                    <label for="id_pai">Menu Pai</label>
                    <select id="id_pai" name="id_pai" class="form-select">
                        <option value="">Nenhum (Menu Raiz)</option>
                        <option value="1">Menu Principal</option>
                        <option value="2">Suporte Técnico</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary">Salvar Menu</button>
                <a href="/menus" class="btn btn-secondary">Cancelar</a>
            </form>
        </section>
    </main>

    <footer class="footer">
        Todos os direitos reservados UDESC &copy; 2026
    </footer>
</body>

</html>
