<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuários - Meu Chatbot</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <header class="header">
        <div class="header-brand">
            <div class="logo">CB</div>
            <h1>Painel de Administração</h1>
        </div>

        <nav class="nav-links">
            <a href="/" class="nav-item">Início</a>
            <a href="/menus" class="nav-item">Lista Menus</a>
            <a href="/menus/novo" class="nav-item">Formulário Menus</a>
            <a href="/usuarios" class="nav-item active">Usuários</a>
            <a href="/historico" class="nav-item">Histórico</a>
            <a href="/login" class="nav-item">Login</a>
        </nav>
    </header>

    <main class="main-container">
        <section class="page-header">
            <h2 class="page-title">Gestão de Administradores</h2>
            <p class="page-subtitle">Cadastre e gerencie credenciais de acesso ao painel.</p>
        </section>

        <section class="form-card">
            <form action="/usuarios/salvar" method="POST">
                <div class="form-group">
                    <label for="username">Nome de Usuário</label>
                    <input type="text" id="username" name="username" class="form-input" placeholder="Ex: admin" required>
                </div>

                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required>
                </div>

                <div class="form-group" style="display: flex; align-items: center; gap: 0.5rem;">
                    <input type="checkbox" id="is_master" name="is_master">
                    <label for="is_master" style="margin-bottom: 0;">Administrador Master</label>
                </div>

                <button type="submit" class="btn btn-primary">Cadastrar Usuário</button>
            </form>
        </section>
    </main>

    <footer class="footer">
        Todos os direitos reservados UDESC &copy; 2026
    </footer>
</body>

</html>
