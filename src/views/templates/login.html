{% extends "base.html" %}

{% block title %}Login - Painel de Administração{% endblock %}

{% block header %}{% endblock %}

{% block content %}
<div class="login-wrapper">
    <div class="form-card login-card">
        <div class="login-heading">
            <div class="logo login-logo">CB</div>
            <h2 class="login-title">Login Administrativo</h2>
            <p class="login-subtitle">Acesse o painel de gerenciamento do chatbot</p>
        </div>

        <div id="login-error" class="login-error">
            {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
            {% endif %}
        </div>

        <form action="/login" method="POST" hx-post="/login" hx-target="#login-error" hx-swap="innerHTML">
            <div class="form-group">
                <label for="username">Usuário</label>
                <input type="text" id="username" name="username" class="form-input" placeholder="Seu usuário" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Entrar</button>
        </form>
    </div>
</div>
{% endblock %}

{% block footer %}{% endblock %}
