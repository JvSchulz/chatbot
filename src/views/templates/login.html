<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Painel de Administração</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body style="align-items: center; justify-content: center;">
    <main class="form-card" style="width: 100%; max-width: 400px; margin: auto;">
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <div class="logo" style="margin: 0 auto 1rem; width: 44px; height: 44px; font-size: 1.2rem; background-color: var(--primary-color); border-radius: var(--radius); display: flex; align-items: center; justify-content: center; color: white; font-weight: bold;">CB</div>
            <h2 style="font-size: 1.4rem; font-weight: 700;">Login Administrativo</h2>
            <p style="color: var(--text-secondary); font-size: 0.9rem; margin-top: 0.25rem;">Acesse o painel do chatbot</p>
        </div>

        <form action="/login" method="POST">
            <div class="form-group">
                <label for="username">Usuário</label>
                <input type="text" id="username" name="username" class="form-input" placeholder="Seu usuário" required>
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Entrar</button>
        </form>
    </main>
</body>

</html>
