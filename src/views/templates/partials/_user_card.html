<div class="form-card" style="margin: 0; max-width: 100%;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem;">
        <div>
            <h2 class="page-title" style="font-size: 1.35rem; margin-bottom: 0.25rem;">
                {% if user and user.id %}Editar Usuário: {{ user.login }}{% else %}Novo Usuário{% endif %}
            </h2>
            <p class="page-subtitle" style="font-size: 0.85rem;">
                Gerencie credenciais e privilégios de acesso ao painel.
            </p>
        </div>
        {% if user and user.id %}
        <button type="button"
                hx-delete="/usuarios/{{ user.id }}"
                hx-target="#user-detail-pane"
                hx-swap="innerHTML"
                hx-confirm="Tem certeza que deseja excluir o usuário '{{ user.login }}'?"
                class="btn btn-secondary"
                style="color: #dc2626; border-color: #fca5a5; font-size: 0.85rem; padding: 0.4rem 0.8rem;">
            Excluir
        </button>
        {% endif %}
    </div>

    <div id="user-error">
        {% if error %}
        <div class="alert alert-danger" style="margin-bottom: 1rem; padding: 0.75rem 1rem; background-color: #fef2f2; border: 1px solid #fecaca; color: #991b1b; border-radius: var(--radius);">
            {{ error }}
        </div>
        {% endif %}
    </div>

    <form hx-post="{% if user and user.id %}/usuarios/{{ user.id }}{% else %}/usuarios{% endif %}"
          hx-target="#user-detail-pane"
          hx-swap="innerHTML">

        <div class="form-group">
            <label for="login">Login / Nome de Usuário</label>
            <input type="text"
                   id="login"
                   name="login"
                   class="form-input"
                   placeholder="Ex: admin"
                   value="{% if user %}{{ user.login }}{% endif %}"
                   required>
        </div>

        <div class="form-group">
            <label for="password">Senha</label>
            <input type="password"
                   id="password"
                   name="password"
                   class="form-input"
                   placeholder="{% if user and user.id %}Deixe em branco para manter a senha atual{% else %}Digite a senha inicial{% endif %}"
                   {% if not user or not user.id %}required{% endif %}>
        </div>

        <div class="form-group" style="display: flex; align-items: center; gap: 0.5rem; margin-top: 1rem;">
            <input type="checkbox"
                   id="is_admin"
                   name="is_admin"
                   value="true"
                   {% if user and user.is_admin %}checked{% endif %}
                   style="width: 18px; height: 18px;">
            <label for="is_admin" style="margin-bottom: 0; cursor: pointer;">
                Perfil de Administrador (acesso completo)
            </label>
        </div>

        <div style="display: flex; gap: 0.75rem; margin-top: 1.5rem;">
            <button type="submit" class="btn btn-primary">
                Salvar Usuário
            </button>
            <a href="javascript:void(0)"
               hx-get="{% if user and user.id %}/usuarios/{{ user.id }}/card{% else %}/usuarios/novo/card{% endif %}"
               hx-target="#user-detail-pane"
               class="btn btn-secondary">
                Limpar
            </a>
        </div>
    </form>
</div>
